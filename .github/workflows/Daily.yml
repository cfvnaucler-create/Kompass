name: Daglig simulering
on:
schedule:
- cron: "30 22 * * 1-5" # vardagar 22:30 UTC, efter att börserna stängt
workflow_dispatch:
permissions:
contents: write
jobs:
run:
runs-on: ubuntu-latest
steps:
- uses: actions/checkout@v4
- uses: actions/setup-python@v5
with:
python-version: "3.11"
- run: pip install -r requirements.txt
- run: python engine.py
- name: Spara resultat
run: |
git config user.name "kompass-bot"
git config user.email "bot@users.noreply.github.com"
git add data/state.json docs/data.json
git diff --staged --quiet || (git commit -m "Daglig körning" && git push)
